<body>
    <h1>Chai aur Javascript</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
   //  setInterval(() => {

    // }, 3000);

    
    // const sayDate = function(){
    //     console.log("Vikky", Date.now());
    // }
    // setInterval(sayDate,1000);


    // const  sayDate= function(str){
    //     console.log(str, Date.now());
    // }
    // setInterval(sayDate,1000, "Hi"); // there is an third argument in it


    const sayDate = function(str){
        console.log(str, Date.now());
    }

    let intervalId = null;  // initially no interval

    document.querySelector('#start').addEventListener('click', function(){

        if(intervalId === null){  // prevent multiple intervals
            intervalId = setInterval(sayDate, 1000, "hi");
        }

    });

    document.querySelector('#stop').addEventListener('click', function(){

        clearInterval(intervalId);
        intervalId = null;   // reset
        console.log("STOPPED");

    });
    
</script>
